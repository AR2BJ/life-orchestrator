<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Life Orchestrator</title>
  </head>
  <body
    class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-6"
  >
    <div
      class="max-w-xl w-full bg-slate-800 border border-slate-700 rounded-2xl p-8 shadow-2xl space-y-6"
    >
      <div class="text-center">
        <h1 class="text-3xl font-extrabold text-indigo-400">
          Life Orchestrator
        </h1>
        <p class="text-slate-400 mt-2 text-sm">
          Select a module to get started
        </p>
      </div>

      <div class="grid grid-cols-1 gap-4 pt-4">
        <a
          href="/habit-tracker"
          class="flex items-center justify-between p-4 bg-slate-700/50 hover:bg-slate-700 rounded-xl transition border border-slate-600/50"
        >
          <span class="font-medium text-slate-200">Habit Tracker</span>
          <span class="text-indigo-400">→</span>
        </a>

        <a
          href="/task-manager"
          class="flex items-center justify-between p-4 bg-slate-700/50 hover:bg-slate-700 rounded-xl transition border border-slate-600/50"
        >
          <span class="font-medium text-slate-200">Task Manager</span>
          <span class="text-emerald-400">→</span>
        </a>

        <a
          href="/time-manager"
          class="flex items-center justify-between p-4 bg-slate-700/50 hover:bg-slate-700 rounded-xl transition border border-slate-600/50"
        >
          <span class="font-medium text-slate-200">Time Manager</span>
          <span class="text-amber-400">→</span>
        </a>
      </div>
    </div>
  </body>
</html>
