<!doctype html>
<html
  lang="en"
  class="dark"
>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Life Orchestrator Core</title>
    <link
      rel="shortcut icon"
      href="/favicon.ico"
      type="image/x-icon"
    />
    <link
      rel="stylesheet"
      href="./packages/ui-theme/src/assets/css/styles.css"
    />
    <link
      rel="stylesheet"
      href="./packages/ui-theme/src/tabler/css/tabler-icons.min.css"
    />
  </head>
  <body
    class="min-h-screen flex flex-col justify-between p-4 md:p-8 bg-bg text-primary selection:bg-brand selection:text-white"
  >
    <!-- Background Ambient Blur -->
    <div
      class="fixed inset-0 pointer-events-none -z-10 flex justify-center items-center overflow-hidden"
    >
      <div
        class="w-150 h-150 bg-brand/10 rounded-full blur-[140px] opacity-60"
      ></div>
    </div>

    <!-- Header Navigation -->
    <header
      class="w-full max-w-7xl mx-auto flex items-center justify-between pb-6 border-b border-border/60"
    >
      <div class="flex items-center gap-3.5">
        <a
          href="/index.html"
          class="w-10 h-10 rounded-xl bg-surface border border-border flex items-center justify-center text-secondary hover:text-primary transition-colors"
        >
          <i class="ti ti-arrow-left text-xl"></i>
        </a>
        <div>
          <h1
            class="text-xl font-extrabold tracking-wide text-primary flex items-center gap-2"
          >
            Life Orchestrator Core
            <span
              class="text-[10px] font-mono font-semibold px-2 py-0.5 rounded-full bg-brand/15 text-brand border border-brand/20"
              >ANALYTICS</span
            >
          </h1>
          <p class="text-xs text-secondary font-medium">
            The focused brain for analysis and bio-guidance
          </p>
        </div>
      </div>
    </header>

    <!-- App Mount Point -->
    <main class="w-full max-w-7xl mx-auto">
      <div id="orchestrator-app"></div>
    </main>

    <!-- Script Entrypoint -->
    <script type="module">
      import { OrchestratorModule } from "./orchestrator/src/index.js";

      const module = new OrchestratorModule({
        mountPoint: "orchestrator-app",
      });

      document.addEventListener("DOMContentLoaded", () => {
        module.init();
      });

      window.addEventListener("storage", () => {
        module.renderAll();
      });
    </script>
  </body>
</html>
