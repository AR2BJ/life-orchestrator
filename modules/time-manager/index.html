<!doctype html>
<html
  lang="en"
  class="bg-surface text-color scroll-smooth scrollbar-thin scrollbar-thumb-surface-2"
>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Time Manager</title>
    <link
      rel="stylesheet"
      href="/modules/time-manager/src/assets/css/styles.css"
    />
    <link
      rel="shortcut icon"
      href="./favicon.ico"
      type="image/x-icon"
    />
    <base href="/modules/time-manager/" />
    <script src="./src/app/theme.js"></script>
  </head>

  <body class="min-h-screen bg-surface text-color">
    <!-- ============================= -->
    <!-- CROSS-MODULE EDGE PANEL START -->
    <!-- ============================= -->
    <div
      id="edge-panel"
      class="group fixed right-0 top-1/2 z-700 -translate-y-1/2 flex items-center transition-transform duration-300 translate-x-[calc(100%-12px)] hover:translate-x-0 data-[expanded=true]:translate-x-0"
      data-expanded="false"
    >
      <!-- Edge Handle Tab -->
      <button
        id="edge-panel-toggle"
        type="button"
        class="flex h-20 w-3 cursor-pointer items-center justify-center rounded-l-md bg-brand/80 text-white shadow-xl transition-all duration-200 group-hover:w-4 group-hover:bg-brand"
        title="Quick Switcher"
        aria-label="Toggle Quick Switcher"
      >
        <div class="h-8 w-1 rounded-full bg-white/60"></div>
      </button>

      <!-- Edge Panel Content Container -->
      <aside
        class="flex flex-col gap-3 rounded-l-2xl border-l border-y border-surface-2 bg-surface/95 p-3 backdrop-blur-md shadow-2xl"
      >
        <!-- Navigation Module Links -->
        <nav class="flex flex-col gap-2">
          <!-- Life Orchestrator (home) -->
          <a
            href="/"
            class="group/item relative flex h-10 w-10 items-center justify-center rounded-xl text-muted hover:bg-surface-2 hover:text-color transition-all hover:scale-105"
            title="Home"
          >
            <i class="ti ti-home text-xl"></i>
          </a>

          <!-- Habit Tracker (Active) -->
          <a
            href="/habit-tracker"
            class="group/item relative flex h-10 w-10 items-center justify-center rounded-xl text-muted hover:bg-surface-2 hover:text-color transition-all hover:scale-105"
            title="Habit Tracker"
          >
            <i class="ti ti-checkup-list text-xl"></i>
          </a>

          <!-- Task Manager -->
          <a
            href="/task-manager"
            class="group/item relative flex h-10 w-10 items-center justify-center rounded-xl text-muted hover:bg-surface-2 hover:text-color transition-all hover:scale-105"
            title="Task Manager"
          >
            <i class="ti ti-checkbox text-xl"></i>
          </a>

          <!-- Time Manager -->
          <a
            href="/time-manager"
            class="group/item relative flex h-10 w-10 items-center justify-center rounded-xl bg-brand text-white shadow-md transition-all hover:scale-105"
            title="Time Manager"
          >
            <i class="ti ti-clock text-xl"></i>
          </a>

          <!-- Life Planner -->
          <a
            href="/life-planner"
            class="group/item relative flex h-10 w-10 items-center justify-center rounded-xl text-muted hover:bg-surface-2 hover:text-color transition-all hover:scale-105"
            title="Life Planner"
          >
            <i class="ti ti-compass text-xl"></i>
          </a>

          <!-- Mind Manager -->
          <a
            href="/mind-manager"
            class="group/item relative flex h-10 w-10 items-center justify-center rounded-xl text-muted hover:bg-surface-2 hover:text-color transition-all hover:scale-105"
            title="Mind Manager"
          >
            <i class="ti ti-brain text-xl"></i>
          </a>
        </nav>
      </aside>
    </div>
    <!-- ============================= -->
    <!-- CROSS-MODULE EDGE PANEL END -->
    <!-- ============================= -->

    <!-- ============================= -->
    <!-- APP CONTAINER START -->
    <!-- ============================= -->

    <div
      id="app-loader"
      class="fixed inset-0 z-9999 grid place-items-center"
    >
      <div class="loader">
        <span class="hour"></span>
        <span class="min"></span>
        <span class="circel"></span>
      </div>
    </div>

    <div
      id="app"
      class="hidden px-8 py-12 lg:ps-8 transition-all duration-300"
    >
      <div id="header-container"></div>

      <div id="mobile-time-container"></div>

      <div id="desktop-nav-container"></div>

      <div id="timer-view-container"></div>

      <div id="analytics-view-container"></div>

      <div id="settings-view-container"></div>

      <div id="edit-modals-container"></div>

      <div id="delete-modals-container"></div>

      <div id="help-modal-container"></div>

      <div
        id="notification-container"
        class="fixed bottom-6 left-1/2 -translate-x-1/2 z-600 flex flex-col gap-3 min-w-70 sm:min-w-80 max-w-lg"
      ></div>
    </div>

    <!-- ============================= -->
    <!-- APP CONTAINER END -->
    <!-- ============================= -->

    <div id="mobile-nav-container"></div>

    <button
      id="scroll-to-top-btn"
      class="fixed bottom-24 lg:bottom-6 right-6 z-40 hidden opacity-0 scale-75 h-10 w-10 cursor-pointer items-center justify-center rounded-lg bg-brand/80 text-white shadow-lg transition duration-400 hover:bg-(--color-brand-hover) hover:scale-110"
      title="Scroll to top"
    >
      <i class="ti ti-chevron-up text-xl lg:text-2xl"></i>
    </button>

    <script
      type="module"
      src="./src/app/app.js"
    ></script>
  </body>
</html>
